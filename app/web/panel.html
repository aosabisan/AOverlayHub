<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AOverlay Hub</title>
<link rel="icon" href="/favicon.ico">
<!--

<style>
  :root {
    --bg: #110b1a; --panel: #19112a; --panel2: #22173a; --line: #3a2a57; --text: #efe9fa; --muted: #a99bc4;
    --accent: #7c3aed; --accent2: #a78bfa; --ok: #c084fc; --danger: #ff5d6c; --warn: #ffc24b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #5b4385; background: #2c1f47; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button.small { padding: 3px 8px; font-size: 12px; }
  button.icon { padding: 3px 7px; min-width: 28px; }
  button:disabled { opacity: 0.45; cursor: default; }
  input[type=text], input[type=number], input[type=password], select, textarea {
    background: #0d0815; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; width: 100%; }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent2); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; vertical-align: middle; flex: none; }
  input[type=color] { width: 38px; height: 30px; padding: 0 2px; border: 1px solid var(--line); border-radius: 6px; background: #0d0815; flex: none; }
  a { color: #c4b5fd; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .spacer { flex: 1; }

  #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: nowrap; position: relative; z-index: 20; }
  header > * { flex: none; }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 16px; }
  .logo img { width: 30px; height: 30px; border-radius: 8px; background: #efe9fa; padding: 2px; object-fit: contain; }
  .tabs { display: flex; gap: 4px; background: #0d0815; border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .tabs button { border: 0; background: transparent; padding: 4px 12px; border-radius: 6px; }
  .tabs button.on { background: var(--accent); color: #fff; font-weight: 700; }
  header > .pills { display: flex; gap: 6px; flex-wrap: nowrap; flex: 1 1 auto; min-width: 0; overflow: hidden; mask-image: linear-gradient(90deg, #000 90%, transparent); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: #0d0815; border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #6f6488; display: inline-block; }
  .pill.ok i { background: var(--ok); box-shadow: 0 0 6px var(--ok); } .pill.bad i { background: var(--danger); } .pill.warn i { background: var(--warn); }
  .menu { position: relative; }
  .menu > .drop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-width: 250px; display: none; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
  .menu.open > .drop { display: block; }
  .drop button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; }
  .drop button:hover { background: #34245a; }
  .drop hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }
  .profsel { display: flex; align-items: center; gap: 6px; }
  .profsel select { width: auto; min-width: 150px; padding: 4px 8px; }

  /* the main area is its own layer, so nothing in it (like the preview's selection box) can ever cover a dialog */
  main { display: grid; grid-template-columns: 270px 1fr 370px; min-height: 0; position: relative; z-index: 0; isolation: isolate; }
  main.hidden, #modView.hidden { display: none; }
  aside, section.inspector { background: var(--panel); min-height: 0; overflow: auto; }
  aside { border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; }
  .credit { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); line-height: 1.5; display: flex; gap: 9px; align-items: flex-start; }
  .credit img { width: 34px; height: 34px; border-radius: 8px; background: #efe9fa; padding: 2px; object-fit: contain; flex: none; }
  .wlogo { display: flex; gap: 16px; align-items: center; margin-bottom: 10px; }
  .wlogo img { width: 84px; height: 84px; border-radius: 16px; background: #efe9fa; padding: 6px; object-fit: contain; }
  section.inspector { border-left: 1px solid var(--line); padding: 12px 14px 60px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 4px 0 10px; }
  h3 { font-size: 15px; margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  h3:first-of-type { border-top: 0; padding-top: 0; }
  details.sec { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
  details.sec > summary { font-weight: 700; font-size: 15px; cursor: pointer; padding: 4px 0 8px; color: var(--text); list-style: none; }
  details.sec > summary::before { content: "\25B8"; display: inline-block; width: 16px; color: var(--muted); transition: transform 0.15s; }
  details.sec[open] > summary::before { transform: rotate(90deg); }

  .olist { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .oitem { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 8px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .oitem:hover { background: #231838; }
  .oitem.sel { background: #2b1d48; border-color: var(--accent2); }
  .oitem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oitem .nm small { display: block; color: var(--muted); font-size: 11px; }
  .oitem .eye { border: 0; background: transparent; padding: 2px 4px; font-size: 15px; }
  .oitem.hidden .nm { opacity: 0.45; }
  .empty-note { color: var(--muted); padding: 10px 4px; }

  .stagewrap { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px; gap: 8px; }
  .previewbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  #previewOuter { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #preview { position: relative; z-index: 0; overflow: hidden; box-shadow: 0 0 0 1px var(--line);
    background: linear-gradient(45deg, #1d1430 25%, transparent 25%) 0 0/24px 24px, linear-gradient(-45deg, #1d1430 25%, transparent 25%) 0 0/24px 24px,
      linear-gradient(45deg, transparent 75%, #1d1430 75%) 0 0/24px 24px, linear-gradient(-45deg, transparent 75%, #1d1430 75%) 0 0/24px 24px, #140e20; }
  #preview.bg { background-size: cover; background-position: center; }
  #previewFrame { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: transparent; }
  #handles { position: absolute; inset: 0; }
  .hbox { position: absolute; border: 1px dashed rgba(255,255,255,0.28); cursor: move; }
  .hbox:hover { border-color: rgba(255,255,255,0.7); }
  .hbox.sel { border: 2px solid var(--accent2); background: rgba(167,139,250,0.10); }
  .hbox .tag { position: absolute; left: -1px; top: -20px; font-size: 11px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 4px 4px 4px 0; white-space: nowrap; display: none; }
  .hbox.sel .tag { display: block; }
  .hd { position: absolute; width: 11px; height: 11px; background: #fff; border: 2px solid var(--accent2); border-radius: 2px; display: none; }
  .hbox.sel .hd { display: block; }
  .hd.nw { left: -6px; top: -6px; cursor: nwse-resize; } .hd.ne { right: -6px; top: -6px; cursor: nesw-resize; }
  .hd.sw { left: -6px; bottom: -6px; cursor: nesw-resize; } .hd.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  .hd.n { left: calc(50% - 6px); top: -6px; cursor: ns-resize; } .hd.s { left: calc(50% - 6px); bottom: -6px; cursor: ns-resize; }
  .hd.w { left: -6px; top: calc(50% - 6px); cursor: ew-resize; } .hd.e { right: -6px; top: calc(50% - 6px); cursor: ew-resize; }
  .guide { position: absolute; background: #ff4fd8; pointer-events: none; display: none; }

  .field { margin: 0 0 10px; }
  .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .field .help { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .field.check > label { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; cursor: pointer; }
  .rangewrap { display: flex; gap: 8px; align-items: center; }
  .rangewrap output { min-width: 62px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .grid4 label { font-size: 11px; color: var(--muted); }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
  .note { background: #1b1330; border: 1px solid #3d2b63; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: #e2d8f7; margin: 8px 0; }
  .note.warn { background: #2a2312; border-color: #574519; color: #f7e3b5; }
  .note.ok { background: #24153d; border-color: #6d3fc9; color: #e4d6ff; }
  .kv { width: 100%; border-collapse: collapse; font-size: 12px; }
  .kv td { padding: 3px; vertical-align: middle; }
  .kv td:first-child { width: 40%; color: var(--muted); word-break: break-all; }

  /* font picker */
  .fontpick { position: relative; }
  .fontlist { position: absolute; left: 0; right: 0; top: calc(100% + 4px); max-height: 300px; overflow: auto; background: #0d0815; border: 1px solid var(--accent2); border-radius: 8px; z-index: 30; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .fontpick.open .fontlist { display: block; }
  .fontlist div { padding: 6px 10px; cursor: pointer; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fontlist div:hover, .fontlist div.hi { background: #2d1f4a; }
  .fontlist small { display: block; font: 11px "Segoe UI", Arial, sans-serif; color: var(--muted); }
  /* pictures and banner graphics */
  .imgpick { display: flex; gap: 8px; align-items: center; }
  .imgpick .thumb { width: 64px; height: 40px; border: 1px solid var(--line); border-radius: 6px; background: #0d0815 center/contain no-repeat; flex: none; }
  .bgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .bgrid button { padding: 4px; height: 52px; position: relative; overflow: hidden; }
  .bgrid button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .bgrid button svg { width: 100%; height: 100%; display: block; }
  .bgrid button span { position: absolute; left: 0; right: 0; bottom: 1px; font-size: 10px; text-shadow: 0 1px 2px #000; }

  /* moderation */
  #modView { display: grid; grid-template-columns: 400px 1fr; min-height: 0; position: relative; z-index: 0; isolation: isolate; }
  #modView > div { min-height: 0; overflow: auto; padding: 14px 16px 60px; }
  #modView > div:first-child { background: var(--panel); border-right: 1px solid var(--line); }
  .ptable { width: 100%; border-collapse: collapse; }
  .ptable th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  .ptable td { padding: 5px 6px; border-bottom: 1px solid #261a3d; vertical-align: middle; font-size: 13px; }
  .ptable tr.off td.ptext { opacity: 0.45; text-decoration: line-through; }
  .ptable tr.fresh td { animation: flash 2.5s ease-out; }
  @keyframes flash { 0% { background: rgba(167,139,250,0.35); } 100% { background: transparent; } }
  .ptable td.ptext { cursor: text; word-break: break-word; }
  .src { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap; color: var(--muted); }
  .src.learned { color: #ffc24b; border-color: #574519; } .src.mod { color: #c4b5fd; border-color: #3d2b63; } .src.you { color: #e4d6ff; border-color: #6d3fc9; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #44365f; border-radius: 99px; transition: 0.15s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(16px); }
  .modbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .modbar input[type=text] { width: auto; flex: 1; min-width: 180px; }
  .modbar select { width: auto; }

  /* dialogs: always on top of everything */
  .modal { position: fixed; inset: 0; background: rgba(8,4,14,0.75); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal.open { display: flex; }
  .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(780px, 100%); max-height: 92vh; overflow: auto; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); position: relative; }
  .dialog h1 { margin: 0 0 6px; font-size: 22px; }
  .dialog .sub { color: var(--muted); margin: 0 0 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel2); cursor: pointer; text-align: left; }
  .card:hover { border-color: var(--accent2); }
  .card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .card b { display: block; margin-bottom: 3px; }
  .card span { color: var(--muted); font-size: 12.5px; }
  .steps { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .steps span { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: #0d0815; border: 1px solid var(--line); color: var(--muted); }
  .steps span.on { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .steps span.done { color: var(--text); }
  .wfoot { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
  .scenelist { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #0d0815; }
  .scenelist label { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }
  .log { font-family: Consolas, monospace; font-size: 12px; background: #0d0815; border: 1px solid var(--line); border-radius: 8px; padding: 8px; white-space: pre-wrap; max-height: 160px; overflow: auto; }
  details summary { cursor: pointer; color: #c4b5fd; margin: 8px 0; }
  ol.how li { margin: 4px 0; }
  code { background: #0d0815; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 12.5px; user-select: all; word-break: break-all; }
  .proflist .prow { display: flex; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 9px 16px; border-radius: 10px; display: none; z-index: 2000; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  @media (max-width: 1150px) { main { grid-template-columns: 230px 1fr 330px; } #modView { grid-template-columns: 340px 1fr; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><img src="/icon.png" alt="">AOverlay Hub</div>
    <div class="tabs"><button id="tabOverlays" class="on">Overlays</button><button id="tabMod">Moderation</button></div>
    <div class="profsel" id="profsel"><span class="muted">Profile</span><select id="profSelect"></select><button class="small" id="btnProfiles">Profiles...</button></div>
    <div class="pills" id="pills"></div>
    <button class="icon" id="btnUndo" title="Undo (Ctrl+Z)">&#8630;</button>
    <button class="icon" id="btnRedo" title="Redo (Ctrl+Y)">&#8631;</button>
    <button id="btnWizard">Setup wizard</button>
    <div class="menu" id="menuTest"><button>Test &#9662;</button>
      <div class="drop">
        <button data-act="testSupport">Send a test supporter</button>
        <button data-act="testChat">Send a test chat message</button>
        <button data-act="testEmotes">Send test emotes (combo and rain)</button>
      </div>
    </div>
    <div class="menu" id="menuMore"><button>More &#9662;</button>
      <div class="drop">
        <button data-act="connections">Connections (Streamer.bot, Kick, Rumble, OBS)</button>
        <button data-act="obs">Set up this profile in OBS</button>
        <button data-act="canvas">Screen size</button>
        <hr>
        <button data-act="newStream">New stream (start "hide until first support" again)</button>
        <button data-act="reload">Reload the overlays in OBS</button>
        <button data-act="clearSupport">Clear the supporter list</button>
        <button data-act="clearTotals">Reset today's totals</button>
        <hr>
        <button data-act="export">Save settings to a file</button>
        <button data-act="import">Load settings from a file</button>
        <hr>
        <button data-act="help">Help</button>
        <button data-act="quit">Quit AOverlay Hub</button>
      </div>
    </div>
  </header>
  <main id="mainView">
    <aside>
      <h2>Overlays in this profile</h2>
      <div class="olist" id="olist"></div>
      <button class="primary" id="btnAdd" style="width:100%">+ Add overlay</button>
      <p class="muted" style="font-size:12px;margin-top:14px">The top of this list is drawn on top. Use &#9650; &#9660; to change the order.</p>
      <div class="credit" id="credit"></div>
    </aside>
    <div class="stagewrap">
      <div class="previewbar">
        <span id="canvasInfo"></span>
        <label><input type="checkbox" id="chkWidgets"> Show web widgets in the preview</label>
        <label><input type="checkbox" id="chkSnap" checked> Snap to edges</label>
        <button class="small" id="btnBg">Preview background...</button>
        <span class="spacer"></span>
        <span>Drag to move, drag corners to resize. Arrow keys nudge (Shift = 10px).</span>
      </div>
      <div id="previewOuter">
        <div id="preview">
          <iframe id="previewFrame" title="Preview"></iframe>
          <div id="handles"></div>
          <div class="guide" id="guideV"></div><div class="guide" id="guideH"></div>
        </div>
      </div>
    </div>
    <section class="inspector" id="inspector"></section>
  </main>
  <div id="modView" class="hidden">
    <div id="modLeft"></div>
    <div id="modRight"></div>
  </div>
</div>

<div class="modal" id="mAdd"><div class="dialog">
  <h1>Add an overlay</h1>
  <p class="sub">Pick what to add. You can change everything about it afterwards.</p>
  <div class="cards" id="addCards"></div>
  <div class="wfoot"><button data-close>Cancel</button></div>
</div></div>
<div class="modal" id="mWizard"><div class="dialog" id="wizard"></div></div>
<div class="modal" id="mInfo"><div class="dialog" id="info"></div></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<input type="file" id="bgFile" accept="image/*" style="display:none">
<input type="file" id="imgFile" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml,image/apng" style="display:none">
<div id="toast"></div>

<script src="/web/common.js"></script>
<script>
(function () {
  "use strict";
  var AOVERLAY_RELEASES = "https://github.com/aosabisan/AOverlayMusic/releases";
  var cfg = AOH.normalizeConfig({});
  var profId = null, selId = null, status = null, fonts = [];
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { if (attrs[k] === undefined) return; if (k === "class") e.className = attrs[k]; else if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); });
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function api(path, body) {
    var opt = { cache: "no-store" };
    if (body !== undefined) { opt.method = "POST"; opt.headers = { "Content-Type": "application/json", "X-AOH": "1" }; opt.body = JSON.stringify(body); }
    return fetch(path, opt).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  var toastTimer;
  function toast(msg) { var t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = "none"; }, 2800); }
  function prof() { return AOH.profileById(cfg, profId); }
  function ovs() { return prof().overlays; }

    var c = cfg.streamerbot;
    return new Promise(function (resolve, reject) {
      var ws, done = false;
      var fin = function (ok, m) { if (done) return; done = true; try { ws.close(); } catch (e) {} (ok ? resolve : reject)(m); };
      try { ws = new WebSocket("ws://" + c.host + ":" + c.port + (c.endpoint || "/")); } catch (e) { reject("That address doesn't look right."); return; }

    box.appendChild(el("div", { class: "note" }, "Rumble can't be moderated: its API is read-only."));
    box.appendChild(el("h3", { text: "What happens" }));
    box.appendChild(control(s, { k: "action", label: "Do this to spammers", t: "select", opts: [["timeout", "Time them out"], ["ban", "Ban them"]] }, after));
    if (s.action === "timeout") {
      var wrap = el("div", { class: "row" });
      var mins = numInput(Math.round(s.timeout / 6) / 10, function (n) { s.timeout = Math.max(1, Math.round(n * 60)); saveModSettings(); }, { min: 0.1, step: 0.5 });
      wrap.appendChild(mins); wrap.appendChild(el("span", { class: "muted", text: "minutes" }));
      box.appendChild(field("Timeout length", wrap, "Mods can switch in chat with !phrasemode ban or !phrasemode timeout."));
    }
    box.appendChild(control(s, { k: "reason", label: "Reason (shown in the platform's moderation log)", t: "text" }, after));
    box.appendChild(control(s, { k: "delete", label: "Delete the message", t: "check" }, after));
    box.appendChild(el("h3", { text: "Who is safe" }));
    box.appendChild(control(s, { k: "exemptMods", label: "Moderators", t: "check" }, after));
    box.appendChild(control(s, { k: "exemptVip", label: "VIPs (and Kick OG badges)", t: "check" }, after));
    box.appendChild(control(s, { k: "trustedAfter", label: "Trust chatters after this many normal messages", t: "number", min: 0, max: 1000, unit: "(0 = never)" }, after));
    box.appendChild(el("div", { class: "muted", style: "font-size:12px;margin:-4px 0 10px" }, "The streamer is always safe."));
    box.appendChild(el("h3", { text: "Learning and commands" }));
    box.appendChild(control(s, { k: "learn", label: "When you or a mod bans someone, add their last message to the list", t: "check" }, after));
    box.appendChild(control(s, { k: "announce", label: "Say so in chat", t: "check" }, after));
    box.appendChild(control(s, { k: "minLength", label: "Shortest phrase that can be learned or added in chat", t: "number", min: 3, max: 200, unit: "letters" }, after));
    box.appendChild(control(s, { k: "commands", label: "Chat commands for you and mods: !addphrase, !delphrase, !undophrase, !phrasemode", t: "check" }, after));
    box.appendChild(el("h3", { text: "Chat delay" }));
    box.appendChild(el("p", { class: "muted", style: "font-size:13px" }, "The delayed chat holds messages for a moment, so spam is removed before it ever appears on stream. 2–3 seconds is usually enough."));
    var chats = allOverlays().filter(function (x) { return x.o.type === "chat"; });
    if (!chats.length) box.appendChild(el("div", { class: "note" }, "No Delayed Chat overlay yet. Add one in the Overlays tab."));
    chats.forEach(function (x) {
      box.appendChild(el("div", { style: "font-weight:600;margin:6px 0" }, esc(x.o.name) + " <span class='muted'>(" + esc(x.p.name) + ")</span>"));
      var g = el("div", { class: "grid2" });
      var a2 = function () { save(); };
      g.appendChild(control(x.o.settings, { k: "kickDelay", label: "Kick (seconds)", t: "number", min: 0, max: 60, step: 0.5 }, a2));
      g.appendChild(control(x.o.settings, { k: "sbDelay", label: "Twitch/YouTube (seconds)", t: "number", min: 0, max: 60, step: 0.5 }, a2));
      box.appendChild(g);
    });
    box.appendChild(el("h3", { text: "Streamer.bot actions" }));
    box.appendChild(el("ol", { class: "how", style: "padding-left:18px;font-size:13px" },
      "<li>Download the import file (or copy the import text).</li><li>In Streamer.bot press <b>Import</b> (top bar) and drop the file in, or paste the text. Two actions appear in the group <b>AOverlay Hub</b>.</li>" +
      "<li>If you already have other spam-phrase actions, turn them off so people aren't timed out twice. Your old list (Streamer.bot global \"learnedPhrases\") is brought over automatically the first time.</li>"));
    var bw = el("div", { class: "btns" });
    var dl = el("button", { class: "primary" }, "Download for Streamer.bot");
    dl.onclick = function () { var a = el("a", { href: "/api/mod/sbpackage?download=1", download: "AOverlay Hub Moderation.sb" }); document.body.appendChild(a); a.click(); a.remove(); };
    var cpb = el("button", {}, "Copy import text");
    cpb.onclick = function () { fetch("/api/mod/sbpackage").then(function (r) { return r.text(); }).then(function (t) { return navigator.clipboard.writeText(t); }).then(function () { toast("Copied. Paste it into Streamer.bot's Import window."); }); };
    bw.appendChild(dl); bw.appendChild(cpb); box.appendChild(bw);
    if (status && status.port && Number(status.port) !== 8096) box.appendChild(el("div", { class: "note warn" }, "AOverlay Hub is using port " + status.port + " right now. Download the file again if that changes."));
  }
  function srcLabel(p) {
    if (p.source === "starter") return ["starter", "Starter list"];
    if (p.source === "you") return ["you", "Added by you"];
    if (p.source === "mod") return ["mod", "Added in chat by " + (p.by || "a mod")];
    if (p.source === "learned") return ["learned", p.by === "older list" ? "From your older list" : "Learned from banning " + (p.by || "someone") + (p.platform ? " (" + p.platform + ")" : "")];
    return ["", p.source || ""];
  }
  function fmtTime(t) { if (!t) return ""; var d = new Date(t); return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function renderModRight() {
    var box = $("#modRight"); box.innerHTML = "";
    if (!mod.data) return;
    var phrases = mod.data.phrases || [];
    box.appendChild(el("h2", { text: "Banned phrases (" + phrases.filter(function (p) { return p.on; }).length + " on, " + phrases.length + " in total)" }));
    var addBar = el("div", { class: "modbar" });
    var addIn = el("input", { type: "text", placeholder: "Add a phrase, e.g. \"cheap viewers at\"" });
    var addB = el("button", { class: "primary" }, "Add");
    var doAdd = function () { var t = addIn.value.trim(); if (!t) return; modOp({ op: "add", text: t }, "Phrase added."); addIn.value = ""; };
    addB.onclick = doAdd; addIn.onkeydown = function (ev) { if (ev.key === "Enter") doAdd(); };
    addBar.appendChild(addIn); addBar.appendChild(addB);
    box.appendChild(addBar);
    var bar = el("div", { class: "modbar" });
    var q = el("input", { type: "text", placeholder: "Search the list..." }); q.value = mod.q;
    q.oninput = function () { mod.q = q.value; drawRows(); };
    var f = el("select");
    [["all", "All"], ["on", "On"], ["off", "Off"], ["learned", "Learned from bans"], ["mod", "Added in chat"], ["you", "Added by you"], ["starter", "Starter list"]].forEach(function (x) { var o = el("option", { value: x[0], text: x[1] }); if (mod.filter === x[0]) o.selected = true; f.appendChild(o); });
    f.onchange = function () { mod.filter = f.value; drawRows(); };
    var restoreB = el("button", { class: "small" }, "Add back the starter list");
    restoreB.onclick = function () { modOp({ op: "starter" }, "Starter phrases added back."); };
    bar.appendChild(q); bar.appendChild(f); bar.appendChild(restoreB);
    box.appendChild(bar);
    var table = el("table", { class: "ptable" });
    table.innerHTML = "<thead><tr><th style='width:48px'>On</th><th>Phrase <span class='muted' style='font-weight:400'>(click to edit)</span></th><th>Where it came from</th><th>Added</th><th></th></tr></thead>";
    var tbody = el("tbody"); table.appendChild(tbody);
    box.appendChild(table);
    function drawRows() {
      tbody.innerHTML = "";
      var ql = mod.q.trim().toLowerCase();
      var list = phrases.slice().sort(function (a, b) { return (b.added || 0) - (a.added || 0); }).filter(function (p) {
        if (ql && String(p.text).toLowerCase().indexOf(ql) < 0) return false;
        if (mod.filter === "on") return p.on; if (mod.filter === "off") return !p.on;
        if (mod.filter !== "all") return p.source === mod.filter;
        return true;
      });
      if (!list.length) { var tr0 = el("tr"); tr0.appendChild(el("td", { colspan: 5, class: "muted", text: "Nothing here." })); tbody.appendChild(tr0); }
      list.forEach(function (p) {
        var tr = el("tr", { class: (p.on ? "" : "off") + (mod.fresh[p.id] && Date.now() - mod.fresh[p.id] < 3000 ? " fresh" : "") });
        var tdOn = el("td"); var sw = el("label", { class: "switch", title: p.on ? "Turn off" : "Turn on" });
        var cb = el("input", { type: "checkbox" }); cb.checked = !!p.on;
        cb.onchange = function () { p.on = cb.checked; tr.classList.toggle("off", !p.on); modOp({ op: "toggle", id: p.id, on: cb.checked }); };
        sw.appendChild(cb); sw.appendChild(el("span")); tdOn.appendChild(sw); tr.appendChild(tdOn);
        var tdT = el("td", { class: "ptext" });
        if (mod.editing === p.id) {
          var ed = el("input", { type: "text" }); ed.value = p.text;
          var okB = el("button", { class: "small primary" }, "Save"), noB = el("button", { class: "small" }, "Cancel");
          var finish = function (saveIt) { mod.editing = null; if (saveIt && ed.value.trim() && ed.value !== p.text) modOp({ op: "edit", id: p.id, text: ed.value.trim() }, "Phrase changed."); else drawRows(); };
          okB.onclick = function () { finish(true); }; noB.onclick = function () { finish(false); };
          ed.onkeydown = function (ev) { if (ev.key === "Enter") finish(true); if (ev.key === "Escape") finish(false); };
          var r = el("div", { class: "row" }); r.appendChild(ed); r.appendChild(okB); r.appendChild(noB); tdT.appendChild(r);
          setTimeout(function () { ed.focus(); }, 0);
        } else {
          tdT.textContent = p.text;
          tdT.onclick = function () { mod.editing = p.id; drawRows(); };
        }
        tr.appendChild(tdT);
        var sl = srcLabel(p); var tdS = el("td"); tdS.appendChild(el("span", { class: "src " + sl[0], text: sl[1] })); tr.appendChild(tdS);
        tr.appendChild(el("td", { class: "muted", style: "white-space:nowrap;font-size:12px", text: fmtTime(p.added) }));
        var tdD = el("td"); var del = el("button", { class: "small danger", title: "Delete" }, "&#10005;");
        del.onclick = function () { if (confirm("Delete \"" + p.text + "\"?")) modOp({ op: "delete", id: p.id }); };
        tdD.appendChild(del); tr.appendChild(tdD);
        tbody.appendChild(tr);
      });
    }
    drawRows();
    var logs = mod.data.log || [];
    var lh = el("h2", { style: "margin-top:24px" }, "Recent actions"); box.appendChild(lh);
    if (!logs.length) box.appendChild(el("p", { class: "muted", text: "Nothing yet. Timeouts and bans made by the Streamer.bot action show up here." }));
    else {
      var lt = el("table", { class: "ptable" });
      lt.innerHTML = "<thead><tr><th>When</th><th>Platform</th><th>Who</th><th>What</th><th>Matched</th></tr></thead>";
      var lb = el("tbody");
      logs.slice(0, 60).forEach(function (l) {
        var tr = el("tr");
        [fmtTime(l.t), l.platform, l.user, (l.ok ? "" : "FAILED ") + (l.action === "ban" ? "Banned" : "Timed out"), l.phrase].forEach(function (x, i) { var td = el("td", { text: x || "" }); if (i === 4) td.title = l.message || ""; tr.appendChild(td); });
        lb.appendChild(tr);
      });
      lt.appendChild(lb); box.appendChild(lt);
      var cl = el("button", { class: "small" }, "Clear the list"); cl.onclick = function () { modOp({ op: "clearlog" }); };
      var bw = el("div", { class: "btns" }); bw.appendChild(cl); box.appendChild(bw);
    }
  }

  /* ---------------- status pills ---------------- */
  function pill(label, state, text) { return "<span class='pill " + state + "' title='" + esc(text || "") + "'><i></i>" + esc(label) + (text ? ": " + esc(text) : "") + "</span>"; }
  function refreshStatus() {
    api("/api/status").then(function (s) {
      status = s;
      var h = pill("Helper", "ok", "running");
      var ago = s.profiles && s.profiles[prof().id];
      var live = typeof ago === "number" && ago < 12;
      h += pill("OBS stage", live ? "ok" : "warn", live ? "showing \"" + prof().name + "\"" : "not open");
      var anyLive = s.liveSecondsAgo >= 0 && s.liveSecondsAgo < 12;
      if (cfg.streamerbot.enabled) { var sb = anyLive && s.live ? s.live.sb : ""; h += pill("Streamer.bot", sb === "connected" ? "ok" : sb ? "bad" : "", sb || "waiting for OBS"); }
      if (anyLive && s.live && s.live.kick) h += pill("Kick chat", s.live.kick === "connected" ? "ok" : "warn", s.live.kick);
      if (cfg.rumble.url) h += pill("Rumble", s.rumble === "ok" ? "ok" : s.rumble ? "bad" : "", s.rumble === "ok" ? (s.rumbleLive ? "live" : "ok") : (s.rumble ? "problem" : "checking"));
      $("#pills").innerHTML = h;
    }).catch(function () { $("#pills").innerHTML = pill("Helper", "bad", "not running - start AOverlay Hub"); })
      .then(function () { setTimeout(refreshStatus, 3000); });
  }

  function creditHtml() {
    return "AOverlay Hub " + esc(AOH.VERSION) + " &middot; made and distributed by <span style='white-space:nowrap'>" + esc(AOH.AUTHOR) + "</span> &middot; <a href='mailto:" + esc(AOH.CONTACT) + "'>" + esc(AOH.CONTACT) + "</a> &middot; <a href='/license' target='_blank'>License</a>";
  }
  $("#credit").innerHTML = "<img src='/icon.png' alt=''><div>AOverlay Hub " + esc(AOH.VERSION) + "<br>Made and distributed by <span style='white-space:nowrap'>" + esc(AOH.AUTHOR) + "</span><br><a href='mailto:" + esc(AOH.CONTACT) + "'>" + esc(AOH.CONTACT) + "</a> &middot; <a href='/license' target='_blank'>License</a></div>";
  function renderAll() { renderProfiles(); renderList(); layoutPreview(); renderInspector(); undoButtons(); }

  /* ---------------- start ---------------- */
  api("/api/fonts").then(function (f) { fonts = f || []; }).catch(function () {});
  api("/api/config").then(function (c) {
    var migrated = !Array.isArray(c.profiles);
    cfg = AOH.normalizeConfig(c);
    try { profId = localStorage.getItem("aoh.profile"); } catch (e) {}
    if (!cfg.profiles.some(function (p) { return p.id === profId; })) profId = cfg.profiles[0].id;
    if (migrated) save(true);
    commitHistory();
    renderAll(); loadPreview(); refreshStatus();
    api("/api/mod").then(function (r) { mod.v = r.v; mod.data = r.data; mod.ids = {}; (r.data.phrases || []).forEach(function (p) { mod.ids[p.id] = true; }); }).catch(function () {});
    if (!cfg.wizardDone) wizard(0);
  }).catch(function () { document.body.innerHTML = "<p style='padding:40px'>Can't reach AOverlay Hub. Start it from the Start menu, then reload this page.</p>"; });
})();
</script>
</body>
</html>
