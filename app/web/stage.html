<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AOverlay Hub - Stage</title>
<!--
  AOverlay Hub stage: the one page OBS shows. Every overlay of one profile is drawn inside it.
  Copyright (c) 2026 Aosabi 「青錆竜也」 aosabi@pm.me. All Rights Reserved. See LICENSE.txt.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  .box { position: absolute; overflow: hidden; box-sizing: border-box; transition: opacity 0.6s ease; }
  .box.autohidden { opacity: 0 !important; }
  .box > iframe { border: 0; background: transparent; transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .placeholder { width: 100%; height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 6px; text-align: center; padding: 10px; border: 2px dashed rgba(124, 92, 255, 0.85);
    background: rgba(124, 92, 255, 0.12); border-radius: 8px; color: #fff; font: 600 20px "Segoe UI", Arial, sans-serif; text-shadow: 0 1px 3px #000; }
  .placeholder small { font-weight: 400; font-size: 14px; opacity: 0.85; }

  /* ---- layered text: shadow, outline and letters stacked on top of each other ---- */
  .tx { display: inline-grid; vertical-align: middle; }
  .tx > span { grid-area: 1 / 1; white-space: inherit; position: relative; }
  /* blur and offsets lift a layer above plain ones, so the order is set explicitly: shadow, then outline, then letters */
  .tx > .sh { z-index: 0; } .tx > .ol { z-index: 1; } .tx > .fi { z-index: 2; }
  .tx { position: relative; z-index: 0; }
  .tx .fi { opacity: var(--fiop, 1); }
  .tx .ol { -webkit-text-stroke: var(--olw, 0) var(--olc, #000); filter: var(--olblur, none); opacity: var(--olop, 1); }
  .tx .ol, .tx .ol * { color: transparent !important; }
  .tx .sh { -webkit-text-stroke: var(--shw, 0) var(--shc, #000); transform: translate(var(--shx, 0), var(--shy, 0)); filter: var(--shblur, none); opacity: var(--shop, 1); }
  .tx .sh, .tx .sh * { color: var(--shc, #000) !important; }
  .tx .ol img, .tx .sh img { visibility: hidden; }
  .no-ol .tx .ol, .no-sh .tx .sh { display: none; }

  /* ---- strips that scroll ---- */
  .vp { position: relative; overflow: hidden; flex: 1; min-width: 0; min-height: 0; }
  .track { position: absolute; left: 0; top: 0; display: flex; will-change: transform; transition: opacity 0.25s ease; }
  .track.h { flex-direction: row; align-items: center; height: 100%; white-space: nowrap; }
  .track.v { flex-direction: column; align-items: stretch; width: 100%; }

  /* ---- support ticker ---- */
  .tk { display: flex; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
  .tk.h { flex-direction: row; align-items: stretch; }
  .tk.v { flex-direction: column; }
  .tk .label { position: relative; flex: none; display: flex; align-items: center; justify-content: center; gap: 0.45em; padding: 0 1.1em; letter-spacing: 0.08em; white-space: nowrap; }
  .tk.h .label { border-right: 1px solid rgba(255,255,255,0.08); }
  .tk.v .label { padding: 0.7em 1em; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .tk .label::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--stripe); }
  .tk.h .vp { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); }
  .tk.v .vp { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); }
  .tk .item { flex: none; display: flex; align-items: center; gap: 0.55em; box-sizing: border-box; border-left: 3px solid; border-radius: 6px; white-space: nowrap; }
  .tk.h .item { height: 2.25em; padding: 0 0.9em 0 0.65em; }
  .tk.v .item { min-height: 2.1em; padding: 0.35em 0.8em 0.35em 0.65em; }
  .tk.v .item .amount { margin-left: auto; }
  .tk .name { overflow: hidden; text-overflow: ellipsis; }
  .tk .badge { flex: none; width: 1.25em; height: 1.25em; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.75em; font-weight: 900; line-height: 1; color: #0b0f14; font-family: "Segoe UI", Arial, sans-serif; overflow: hidden; }
  .tk .badge.light { color: #fff; }
  .tk .badge img { width: 100%; height: 100%; object-fit: contain; }
  .tk .item.fresh { animation: aoh-glow 1.1s ease-in-out var(--glow-n, 5); }
  @keyframes aoh-glow { 0%, 100% { box-shadow: 0 0 0 transparent; } 50% { box-shadow: 0 0 14px var(--glow, #3ddc84); } }

  /* ---- now playing ---- */
  .np { display: flex; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; align-items: center; gap: 0.5em; padding: 0 0.7em; }
  .np.v { flex-direction: column; padding: 0.7em 0; }
  .np .lbl { flex: none; white-space: nowrap; }
  .np .song { white-space: nowrap; flex: none; }
  .np.v .lbl, .np.v .song { writing-mode: vertical-rl; }
  .np .vp { align-self: stretch; }
  .np.h .track { align-items: center; }
  .np.v .track { flex-direction: column; align-items: center; width: 100%; }
  .idle-hidden { visibility: hidden; }

  /* ---- chat ---- */
  .chat { position: absolute; inset: 0; display: flex; padding: 8px; box-sizing: border-box; overflow: hidden; }
  .chat.stack { flex-direction: column; justify-content: flex-end; align-items: flex-start; }
  .chat.stack.top { flex-direction: column-reverse; }
  .chat.line { flex-direction: row; align-items: center; justify-content: flex-end; white-space: nowrap; }
  .chat.line.top { flex-direction: row-reverse; }
  .chat .msg { padding: 0.28em 0.5em; line-height: 1.35; word-wrap: break-word; overflow-wrap: anywhere; animation: aoh-pop 0.25s ease-out; transition: opacity 0.6s ease, transform 0.6s ease; flex: none; max-width: 100%; box-sizing: border-box; }
  .chat.line .msg { white-space: nowrap; max-width: none; }
  .chat .msg.fading { opacity: 0; transform: translateX(-12px); }
  .chat .cname { font-weight: 700; margin-right: 0.35em; }
  .chat .dot { display: inline-block; width: 0.55em; height: 0.55em; border-radius: 50%; margin-right: 0.35em; vertical-align: middle; box-shadow: 0 0 0 2px rgba(0,0,0,0.5); }
  .chat .picon { width: 1.05em; height: 1.05em; vertical-align: middle; margin-right: 0.35em; object-fit: contain; border-radius: 3px; }
  .chat .avatar { width: 1.35em; height: 1.35em; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 0.3em; background: rgba(255,255,255,0.15); }
  .chat .tbadge { display: inline-block; font-size: 0.55em; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-right: 4px; vertical-align: middle; background: rgba(255,255,255,0.2); text-transform: uppercase; }
  .chat .ibadge { height: 1em; vertical-align: middle; margin-right: 4px; }
  .chat .emote { height: 1.6em; vertical-align: middle; }
  @keyframes aoh-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---- emote combo ---- */
  .combo { position: absolute; inset: 0; display: flex; box-sizing: border-box; padding: 6px; overflow: hidden; }
  .combo.up { flex-direction: column-reverse; align-items: flex-start; }
  .combo.down { flex-direction: column; align-items: flex-start; }
  .combo.right { flex-direction: row; align-items: flex-start; flex-wrap: wrap; }
  .combo.left { flex-direction: row-reverse; align-items: flex-start; flex-wrap: wrap; }
  .combo .row { display: flex; align-items: center; gap: 12px; padding: 6px 14px; box-sizing: border-box; flex: none; animation: aoh-pop 0.25s ease-out; }
  .combo .row img { object-fit: contain; }
  .combo .bump { animation: aoh-bump 0.25s ease-out; }
  @keyframes aoh-bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }

  /* ---- emote rain ---- */
  .rain { position: absolute; inset: 0; overflow: hidden; }
  .rain img { position: absolute; left: 0; top: 0; object-fit: contain; will-change: transform, opacity; pointer-events: none; }

  /* ---- banner ---- */
  .bn { position: absolute; inset: 0; }
  .bn .gfx { position: absolute; inset: 0; }
  .bn .gfx svg { width: 100%; height: 100%; display: block; }
  .bn .gfx img { width: 100%; height: 100%; display: block; }
  .bn .words { position: absolute; inset: 0; display: flex; align-items: center; box-sizing: border-box; overflow: hidden; }
  .bn .msgtx { transition: opacity 0.5s ease; white-space: nowrap; }
  .bn .msgtx.out { opacity: 0; }

  #debug { position: fixed; left: 4px; bottom: 4px; max-width: 60vw; max-height: 40vh; overflow: auto; background: rgba(0,0,0,0.85);
    color: #b8ffcf; font: 12px/1.35 Consolas, monospace; padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; display: none; z-index: 99999; }
</style>
</head>
<body>
<div id="canvas"></div>
<div id="debug"></div>
<script src="/web/common.js"></script>
<script>
(function () {
  "use strict";
  var Q = new URLSearchParams(location.search);
  var PREVIEW = Q.get("preview") === "1";
  var SHOW_WIDGETS = Q.get("widgets") === "1";
  var PROFILE = Q.get("profile") || "";
  // Only copies running inside OBS talk to Streamer.bot and Kick and report support, so events count once.
  var LIVE = !PREVIEW && (!!window.obsstudio || Q.get("live") === "1");
  var DEBUG = Q.get("debug") === "1";

  var canvasEl = document.getElementById("canvas");
  var debugEl = document.getElementById("debug");
  if (DEBUG) debugEl.style.display = "block";
  var dbgLines = [];
  function log(m) {
    if (!DEBUG) return;
    dbgLines.push(new Date().toLocaleTimeString() + "  " + m);
    if (dbgLines.length > 80) dbgLines.shift();
    debugEl.textContent = dbgLines.join("\n");
    debugEl.scrollTop = debugEl.scrollHeight;
  }
  function api(path, body) {
    var opt = { cache: "no-store" };
    if (body !== undefined) { opt.method = "POST"; opt.headers = { "Content-Type": "application/json", "X-AOH": "1" }; opt.body = JSON.stringify(body); }
    return fetch(path, opt).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function str(v) { return (typeof v === "string" && v.trim() !== "") ? v.trim() : null; }
  function firstStr() { for (var i = 0; i < arguments.length; i++) { var s = str(arguments[i]); if (s) return s; } return null; }
  function toNum(v) {
    if (typeof v === "number" && isFinite(v)) return v;
    if (typeof v === "string" && v.trim() !== "" && isFinite(Number(v))) return Number(v);
    return null;
  }
  function firstNum() { for (var i = 0; i < arguments.length; i++) { var n = toNum(arguments[i]); if (n !== null) return n; } return null; }
  function get(o, p) { return AOH.getPath(o, p); }
  function lower(s) { return String(s || "").toLowerCase(); }
  function nameSet(text) { var s = {}; AOH.listOf(text).forEach(function (n) { s[lower(n).replace(/^@/, "")] = true; }); return s; }
  function safeUrl(u) { u = String(u || ""); return /^(https:\/\/|\/uploads\/|data:image\/)/i.test(u) ? esc(u) : ""; }
  function safeColor(c) { c = String(c || ""); if (/^[0-9a-f]{6}$/i.test(c)) c = "#" + c; return /^#[0-9a-f]{3,8}$/i.test(c) ? c : ""; }

  /* =====================================================================
     Layered text
     ===================================================================== */
  // Sets the text style of a container; everything made with layered() inside it uses it.
  function applyText(el, st) {
    st = AOH.textStyle(st);
    el.style.fontFamily = AOH.fontStack(st.font);
    el.style.fontSize = st.size + "px";
    el.style.fontWeight = st.bold ? "700" : "400";
    el.style.fontStyle = st.italic ? "italic" : "normal";
    el.style.color = st.color;
    el.style.setProperty("--fiop", String(1 - st.see / 100));
    el.style.setProperty("--olw", (st.outlineWidth * 2) + "px");
    el.style.setProperty("--olc", st.outlineColor);
    el.style.setProperty("--olblur", st.outlineFade > 0 ? "blur(" + st.outlineFade + "px)" : "none");
    el.style.setProperty("--olop", String(1 - st.outlineSee / 100));
    var a = (st.shadowAngle || 0) * Math.PI / 180;
    el.style.setProperty("--shx", (Math.cos(a) * st.shadowDistance).toFixed(2) + "px");
    el.style.setProperty("--shy", (Math.sin(a) * st.shadowDistance).toFixed(2) + "px");
    el.style.setProperty("--shc", st.shadowColor);
    el.style.setProperty("--shw", st.outline ? (st.outlineWidth * 2) + "px" : "0px");
    el.style.setProperty("--shblur", st.shadowFade > 0 ? "blur(" + (st.shadowFade / 2) + "px)" : "none");
    el.style.setProperty("--shop", String(1 - st.shadowSee / 100));
    el.classList.toggle("no-ol", !st.outline);
    el.classList.toggle("no-sh", !st.shadow);
  }
  // Text (as HTML) drawn three times: shadow, outline and letters. "color" overrides the letters' colour.
  function layered(html, color, cls) {
    var t = document.createElement("span");
    t.className = "tx" + (cls ? " " + cls : "");
    t.innerHTML = '<span class="sh">' + html + '</span><span class="ol">' + html + '</span><span class="fi"' + (color ? ' style="color:' + esc(color) + '"' : "") + ">" + html + "</span>";
    return t;
  }

  /* =====================================================================
     State from the helper
     ===================================================================== */
  var cfg = AOH.normalizeConfig({});
  var profile = cfg.profiles[0];
  var cfgVer = -1, supVer = -1, evSeq = -1;
  var support = { list: [], totals: null, streamStart: 0 };
  var modules = {};

  function fitCanvas() {
    var cw = cfg.canvas.w || 1920, ch = cfg.canvas.h || 1080;
    canvasEl.style.width = cw + "px"; canvasEl.style.height = ch + "px";
    var s = window.innerWidth / cw;
    if (!isFinite(s) || s <= 0) s = 1;
    canvasEl.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", function () { fitCanvas(); eachAll(function (m) { if (m.mod.resize) m.mod.resize(); }); });
  function eachAll(fn) { Object.keys(modules).forEach(function (id) { if (modules[id].mod) fn(modules[id]); }); }
  function eachModule(type, fn) { eachAll(function (m) { if (m.o.type === type) fn(m.mod, m.o); }); }

  function applyConfig(newCfg) {
    cfg = AOH.normalizeConfig(newCfg);
    profile = AOH.profileById(cfg, PROFILE);
    fitCanvas();
    var seen = {};
    profile.overlays.forEach(function (o, index) {
      seen[o.id] = true;
      var m = modules[o.id];
      var json = JSON.stringify(o.settings);
      if (m && m.o.type !== o.type) { destroy(o.id); m = null; }
      if (!m) {
        var el = document.createElement("div");
        el.className = "box"; el.id = "box-" + o.id;
        canvasEl.appendChild(el);
        m = modules[o.id] = { o: o, el: el, json: null, mod: null };
      }
      var e = m.el;
      e.style.left = o.x + "px"; e.style.top = o.y + "px"; e.style.width = o.w + "px"; e.style.height = o.h + "px";
      e.style.opacity = o.opacity; e.style.zIndex = String(index + 1);
      e.style.display = o.visible ? "" : "none";
      var sizeChanged = m.o.w !== o.w || m.o.h !== o.h;
      m.o = o;
      if (!m.mod) { m.mod = MODULES[o.type](e, o); m.json = json; }
      else if (m.json !== json) { m.mod.update(o); m.json = json; }
      else if (sizeChanged && m.mod.resize) m.mod.resize();
    });
    Object.keys(modules).forEach(function (id) { if (!seen[id]) destroy(id); });
    if (LIVE) { SB.configure(); KICK.configure(); }
  }
  function destroy(id) {
    var m = modules[id]; if (!m) return;
    try { if (m.mod && m.mod.destroy) m.mod.destroy(); } catch (e) {}
    m.el.remove(); delete modules[id];
  }

  var pollTimer = null;
  function poll() {
    clearTimeout(pollTimer);
    api("/api/poll?v=" + cfgVer + "&s=" + supVer + "&e=" + evSeq + (LIVE ? "&live=1" : ""))
      .then(function (r) {
        if (r.config !== undefined && r.v !== cfgVer) { cfgVer = r.v; applyConfig(r.config); }
        if (r.support !== undefined && r.s !== supVer) {
          supVer = r.s; support = r.support || { list: [], totals: null, streamStart: 0 };
          eachModule("ticker", function (mod) { mod.refresh(); });
        }
        if (Array.isArray(r.events)) { var first = evSeq < 0; evSeq = r.e; if (!first) r.events.forEach(handleHubEvent); }
        else if (typeof r.e === "number") evSeq = r.e;
      })
      .catch(function (e) { log("helper not reachable: " + e.message); })
      .then(function () { pollTimer = setTimeout(poll, PREVIEW ? 600 : 800); });
  }
  function handleHubEvent(ev) {
    if (!ev) return;
    if (ev.type === "reload") { location.reload(); return; }
    if (ev.type === "chat-test") { CHAT.emit(testMessage(ev)); return; }
    if (ev.type === "chat" && ev.platform === "rumble") { CHAT.emit(fromRumble(ev)); return; }
    if (ev.type === "chat-delete" && ev.platform === "rumble") { CHAT.emit({ type: "delete", platform: "rumble", ids: (ev.ids || []).map(String) }); return; }
    if (ev.type === "emote-test") { CHAT.emit(testMessage({ platform: "kick", text: "emote test", emotes: true })); }
  }

  /* =====================================================================
     Smooth scrolling (ticker, music, banner)
     ===================================================================== */
  var scrollers = [];
  function Scroller(vp, track) { this.vp = vp; this.track = track; this.p = 0; this.S = 1; this.on = false; this.axis = "x"; this.neg = true; this.speed = 60; scrollers.push(this); }
  Scroller.prototype.set = function (nodes, opt) {
    var self = this, tr = this.track;
    this.axis = opt.axis; this.speed = opt.speed; this.neg = opt.dir === "left" || opt.dir === "up";
    tr.innerHTML = "";
    nodes.forEach(function (n) { tr.appendChild(n); });
    var vlen = this.axis === "x" ? this.vp.clientWidth : this.vp.clientHeight;
    this.S = Math.max(1, this.axis === "x" ? tr.scrollWidth : tr.scrollHeight);
    var scroll = opt.mode === "always" || (opt.mode === "auto" && this.S > vlen + 1);
    if (!scroll || !nodes.length) { this.on = false; tr.style.transform = "none"; return false; }
    var copies = Math.ceil(vlen / this.S) + 2;
    for (var c = 1; c < copies; c++) nodes.forEach(function (n) { tr.appendChild(n.cloneNode(true)); });
    var pad = Math.min(40, vlen * 0.05);
    this.p = opt.fresh ? (this.neg ? (((-(vlen - pad)) % this.S) + this.S) % this.S : pad) : this.p % this.S;
    this.on = true; this.paint();
    return true;
  };
  Scroller.prototype.paint = function () {
    var T = this.neg ? -this.p : this.p - this.S;
    this.track.style.transform = this.axis === "x" ? "translateX(" + T + "px)" : "translateY(" + T + "px)";
  };
  Scroller.prototype.tick = function (dt) { if (!this.on) return; this.p = (this.p + this.speed * dt) % this.S; this.paint(); };
  Scroller.prototype.destroy = function () { var i = scrollers.indexOf(this); if (i >= 0) scrollers.splice(i, 1); };
  var lastTs = 0;
  function frame(ts) {
    if (lastTs) { var dt = Math.min(1, (ts - lastTs) / 1000); scrollers.forEach(function (s) { s.tick(dt); }); }
    lastTs = ts; requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function fmtMoney(n, cur) {
    n = toNum(n); if (n === null) return "";
    cur = (str(cur) || "USD").toUpperCase();
    try { return new Intl.NumberFormat("en-US", { style: "currency", currency: cur }).format(n); } catch (e) { return n.toFixed(2) + " " + cur; }
  }
  function fmtInt(n) { try { return new Intl.NumberFormat("en-US").format(n); } catch (e) { return String(n); } }
  var LOGO = { kick: "https://kick.com/favicon.ico", twitch: "https://www.twitch.tv/favicon.ico", youtube: "https://www.youtube.com/favicon.ico", rumble: "https://rumble.com/favicon.ico" };

  /* =====================================================================
     Chat feed shared by the chat box and the emote overlays
     message: { platform, ids[], user{id,login,name}, color, role, badgesHtml, avatar, text, html, emotes[{url,name}] }
     ===================================================================== */
  var CHAT = (function () {
    var subs = [];
    return {
      on: function (fn) { subs.push(fn); return function () { var i = subs.indexOf(fn); if (i >= 0) subs.splice(i, 1); }; },
      emit: function (m) { if (!m) return; subs.slice().forEach(function (fn) { try { fn(m); } catch (e) { log("chat error: " + e.message); } }); }
    };
  })();
  function needsPlatform(p) {
    return profile.overlays.some(function (o) {
      if (!o.visible) return false;
      if (o.type === "chat") return o.settings.sources[p];
      if (o.type === "emoteCombo" || o.type === "emoteRain") return o.settings.platforms[p];
      return false;
    });
  }
  function emoteImg(u, alt) { var s = safeUrl(u); return s ? '<img class="emote" alt="' + esc(alt || "") + '" src="' + s + '">' : esc(alt || ""); }
  function imgBadge(u, alt) { var s = safeUrl(u); return s ? '<img class="ibadge" alt="' + esc(alt || "") + '" src="' + s + '">' : ""; }
  function textBadge(t) { return '<span class="tbadge">' + esc(t) + "</span>"; }
  function imgBadgesHtml(badges) { var h = ""; (badges || []).forEach(function (b) { if (b) h += imgBadge(b.imageUrl || b.ImageUrl, b.name || b.info || ""); }); return h; }
  function partsToHtml(parts, emotes) {
    return parts.map(function (p) {
      if (!p) return "";
      var u = p.imageUrl || p.ImageUrl;
      if (p.type === "emote" && u) { emotes.push({ url: u, name: p.text }); return emoteImg(u, p.text); }
      return esc(p.text || "");
    }).join("");
  }
  function namedEmotes(text, list, emotes) {
    var map = {};
    (list || []).forEach(function (e) { var n = e.name || e.Name, u = e.imageUrl || e.ImageUrl; if (n && u) map[n] = u; });
    return String(text).split(/(\s+)/).map(function (w) { if (map[w]) { emotes.push({ url: map[w], name: w }); return emoteImg(map[w], w); } return esc(w); }).join("");
  }
  function kickHtml(text, emotes) {
    return String(text).split(/(\[emote:\d+:[^\]]*\])/g).map(function (part) {
